<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Punam 🥰</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Sacramento&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #0d0f18 0%, #1a1025 50%, #0d0f18 100%);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            overflow-x: hidden;
        }
        .container {
            max-width: 450px;
            width: 100%;
            text-align: center;
            z-index: 2;
            padding-bottom: 40px;
        }
        h1 {
            font-family: 'Sacramento', cursive;
            font-size: 3.5rem;
            color: #ff758c;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(255, 117, 140, 0.6);
        }
        .subtitle {
            font-size: 0.95rem;
            color: #d1d5db;
            margin-bottom: 25px;
            line-height: 1.5;
            padding: 0 10px;
        }
        .photo-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 117, 140, 0.3);
            border-radius: 24px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 25px rgba(255, 117, 140, 0.2);
            margin-bottom: 30px;
        }
        .photo-container {
            width: 100%;
            height: 420px;
            border-radius: 18px;
            overflow: hidden;
            position: relative;
        }
        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .countdown-box {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .countdown-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffb6c1;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .timer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .time-card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 12px 5px;
            border: 1px solid rgba(255, 117, 140, 0.2);
        }
        .time-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ff758c;
        }
        .time-label {
            font-size: 0.7rem;
            color: #9ca3af;
            text-transform: uppercase;
            margin-top: 4px;
        }
        .music-btn {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: #fff;
            border: none;
            border-radius: 50px;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .music-btn:active {
            transform: scale(0.95);
        }
        .hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }
        .heart {
            position: absolute;
            color: rgba(255, 117, 140, 0.2);
            font-size: 20px;
            animation: floatUp 6s linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="hearts-bg" id="heartsBg"></div>
    <div class="container">
        <h1>Happy Birthday Punam 🥰</h1>
        <p class="subtitle">Counting down every magical moment until June 6th & celebrating the absolute sunshine you bring into my life! ✨</p>
        
        <div class="photo-card">
            <div class="photo-container">
                <img src="1000700453.jpg" alt="Punam Photo">
            </div>
        </div>

        <div class="countdown-box">
            <div class="countdown-title">⏳ Countdown to June 6th</div>
            <div class="timer-grid">
                <div class="time-card">
                    <div class="time-value" id="days">00</div>
                    <div class="time-label">Days</div>
                </div>
                <div class="time-card">
                    <div class="time-value" id="hours">00</div>
                    <div class="time-label">Hours</div>
                </div>
                <div class="time-card">
                    <div class="time-value" id="minutes">00</div>
                    <div class="time-label">Mins</div>
                </div>
                <div class="time-card">
                    <div class="time-value" id="seconds">00</div>
                    <div class="time-label">Secs</div>
                </div>
            </div>
        </div>

        <button class="music-btn" id="musicBtn" onclick="toggleMusic()">
            🎵 Play Birthday Music
        </button>
    </div>

    <audio id="bgMusic" loop>
        <source src="https://actions.google.com/sounds/v1/ambiences/daytime_forest_bonfire.ogg" type="audio/ogg">
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf756.mp3" type="audio/mpeg">
    </audio>

    <script>
        const heartsBg = document.getElementById('heartsBg');
        const heartSymbols = ['❤️', '💖', '✨', '💕', '🌸'];
        setInterval(() => {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            heartsBg.appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }, 400);

        function updateCountdown() {
            const now = new Date();
            let year = now.getFullYear();
            let targetDate = new Date(year, 5, 6); // June 6th
            if (now > targetDate) {
                targetDate = new Date(year + 1, 5, 6);
            }
            const diff = targetDate - now;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById('days').innerText = String(days).padStart(3, '0');
            document.getElementById('hours').innerText = String(hours).padStart(2, '0');
            document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
            document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        const music = document.getElementById('bgMusic');
        let isPlaying = false;
        function toggleMusic() {
            if (!isPlaying) {
                music.play().then(() => {
                    isPlaying = true;
                    document.getElementById('musicBtn').innerText = '⏸ Pause Music';
                }).catch(e => console.log(e));
            } else {
                music.pause();
                isPlaying = false;
                document.getElementById('musicBtn').innerText = '🎵 Play Birthday Music';
            }
        }
    </script>
</body>
</html>
